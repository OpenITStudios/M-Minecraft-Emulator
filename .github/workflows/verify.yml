name: Emulator Source Verification (manual)

# Explicit user approval: run full source CI on every Local push.
# Manual Quick / Full Source / Windows Build remain available. No PR, schedule,
# installer, driver load, login or deployment triggers.
on:
  push:
    branches:
      - Local
  workflow_dispatch:
    inputs:
      scope:
        description: Select one verification tier
        required: true
        default: quick
        type: choice
        options:
          - quick
          - full-source
          - windows-build

permissions:
  contents: read

# Cancel superseded automatic commits; never cancel an operator's manual run.
concurrency:
  group: emulator-${{ github.ref }}-${{ github.event_name == 'push' && 'automatic' || format('manual-{0}', inputs.scope) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  quick:
    name: Quick source contracts (Windows)
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'quick' && github.ref == 'refs/heads/Local'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          package-manager-cache: false
      # Separate steps: PowerShell may continue to the next native command
      # after a non-zero exit code in a multi-command run block.
      - name: Verify repository contracts
        run: npm run verify:repository
      - name: Test localtest recorder
        run: npm run test:localtest
      - name: Test feasibility reports
        run: npm run test:feasibility
      - name: Test native feasibility
        run: npm run test:native-feasibility
      - name: Test Sandboxie feasibility
        run: npm run test:sandboxie-feasibility
      - name: Test PresentMon analysis
        run: npm run test:presentmon
      - name: Report exact commit and proof boundary
        if: always()
        shell: pwsh
        run: |
          "### Quick source verification (Windows)" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Node source checks only; does not test Minecraft, accounts, kernel driver or a local Windows PC." >> $env:GITHUB_STEP_SUMMARY

  full:
    name: Full source (Windows)
    if: github.ref == 'refs/heads/Local' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full-source'))
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Install Rust 1.98.1
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Install pinned desktop dependencies
        run: npm run setup
      # Keep ALL verification stages identical to package.json verify:source.
      # Each stage is independent so one manual run exposes all failures;
      # the final gate fails if ANY stage had a non-success outcome.
      - name: Verify repository stage
        id: repository
        continue-on-error: true
        run: npm run verify:repository -- --g0
      - name: Verify localtest stage
        id: localtest
        continue-on-error: true
        run: npm run test:localtest
      - name: Verify feasibility stage
        id: feasibility
        continue-on-error: true
        run: npm run test:feasibility
      - name: Verify isolation stage
        id: isolation
        continue-on-error: true
        run: npm run test:isolation-source
      - name: Verify native feasibility stage
        id: native_feasibility
        continue-on-error: true
        run: npm run test:native-feasibility
      - name: Verify sandboxie stage
        id: sandboxie
        continue-on-error: true
        run: npm run test:sandboxie-feasibility
      - name: Verify native performance stage
        id: native_performance
        continue-on-error: true
        run: npm run test:native-performance
      - name: Verify presentmon stage
        id: presentmon
        continue-on-error: true
        run: npm run test:presentmon
      - name: Verify desktop stage
        id: desktop
        continue-on-error: true
        run: npm run check:desktop
      - name: Verify runtime check stage
        id: runtime_check
        continue-on-error: true
        run: npm run check:runtime
      - name: Verify runtime test stage
        id: runtime_test
        continue-on-error: true
        run: npm run test:runtime
      - name: Verify runtime format stage
        id: runtime_format
        continue-on-error: true
        run: npm run format:runtime
      - name: Enforce all full-source results
        if: always()
        shell: pwsh
        env:
          STAGE_REPOSITORY: ${{ steps.repository.outcome }}
          STAGE_LOCALTEST: ${{ steps.localtest.outcome }}
          STAGE_FEASIBILITY: ${{ steps.feasibility.outcome }}
          STAGE_ISOLATION: ${{ steps.isolation.outcome }}
          STAGE_NATIVE_FEASIBILITY: ${{ steps.native_feasibility.outcome }}
          STAGE_SANDBOXIE: ${{ steps.sandboxie.outcome }}
          STAGE_NATIVE_PERFORMANCE: ${{ steps.native_performance.outcome }}
          STAGE_PRESENTMON: ${{ steps.presentmon.outcome }}
          STAGE_DESKTOP: ${{ steps.desktop.outcome }}
          STAGE_RUNTIME_CHECK: ${{ steps.runtime_check.outcome }}
          STAGE_RUNTIME_TEST: ${{ steps.runtime_test.outcome }}
          STAGE_RUNTIME_FORMAT: ${{ steps.runtime_format.outcome }}
        run: |
          $results = [ordered]@{
            'repository' = $env:STAGE_REPOSITORY
            'localtest' = $env:STAGE_LOCALTEST
            'feasibility' = $env:STAGE_FEASIBILITY
            'isolation' = $env:STAGE_ISOLATION
            'native_feasibility' = $env:STAGE_NATIVE_FEASIBILITY
            'sandboxie' = $env:STAGE_SANDBOXIE
            'native_performance' = $env:STAGE_NATIVE_PERFORMANCE
            'presentmon' = $env:STAGE_PRESENTMON
            'desktop' = $env:STAGE_DESKTOP
            'runtime_check' = $env:STAGE_RUNTIME_CHECK
            'runtime_test' = $env:STAGE_RUNTIME_TEST
            'runtime_format' = $env:STAGE_RUNTIME_FORMAT
          }
          "### Individual source-stage verdicts" >> $env:GITHUB_STEP_SUMMARY
          $failed = 0
          foreach ($item in $results.GetEnumerator()) {
            "$($item.Key): $($item.Value)" >> $env:GITHUB_STEP_SUMMARY
            if ($item.Value -ne 'success') { $failed++ }
          }
          if ($failed -gt 0) {
            throw "$failed source verification stage(s) failed or were skipped; review each stage log."
          }
      # The automatic Local-push pipeline compiles Tauri after all source
      # checks pass, in the SAME Windows job. No extra runner or installer.
      - name: Auto compile Windows desktop (no installer)
        if: github.event_name == 'push'
        run: cargo build --locked --target x86_64-pc-windows-msvc --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Report exact commit and proof boundary
        if: always()
        shell: pwsh
        run: |
          "### Full source verification" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Event: $env:GITHUB_EVENT_NAME. Automatic push runs also compile Tauri after source PASS; manual Full Source is source-only. No driver installation, Minecraft sign-in or gameplay." >> $env:GITHUB_STEP_SUMMARY

  windows-build:
    name: Windows desktop compile only (no installer)
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'windows-build' && github.ref == 'refs/heads/Local'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: Rust 1.98.1 MSVC
        shell: pwsh
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt
          rustup default 1.98.1
      - name: Install pinned desktop dependencies
        run: npm run setup
      - name: Prepare desktop icons
        run: npm --prefix apps/desktop run prepare:icons
      - name: Compile desktop frontend
        run: npm --prefix apps/desktop run build:frontend
      - name: Compile Tauri desktop (no packaging or installation)
        run: cargo build --locked --target x86_64-pc-windows-msvc --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Report exact commit and proof boundary
        if: always()
        shell: pwsh
        run: |
          "### Windows desktop compilation" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA" >> $env:GITHUB_STEP_SUMMARY
          "Build only. No NSIS installer, driver signing/load, Sandboxie mutation or Minecraft launch." >> $env:GITHUB_STEP_SUMMARY
