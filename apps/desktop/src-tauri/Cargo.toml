[package]
name = "m-bedrock-virtual-clients"
version = "0.1.0"
description = "M-Bedrock Virtual Clients desktop manager"
authors = ["MIVUBI-STD"]
edition = "2021"
rust-version = "1.98"
publish = false

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }
serde_json = "1"

[dependencies]
rfd = "0.17.2"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tauri = { version = "2.12.4", features = [] }
virtual-clients-core = { package = "m-bedrock-virtual-clients-core", path = "../../../engine/runtime-core" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_WinTrust", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_System_RemoteDesktop", "Win32_System_Services", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Never enabled by default. Requires the dedicated identity/payload-free
# preview package overlay, verified again inside build.rs.
native-workspace-preview = []
