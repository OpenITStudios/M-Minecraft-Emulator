[package]
name = "lazy-tester-global-gamepad-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# NOT a production, slot-addressable Minecraft input backend.
# Separate from Tauri, DEV.cmd, default workspace and installer.
# Dependency resolution, lockfile creation, builds and runtime tests deferred.
[target.'cfg(windows)'.dependencies]
vigem-rust = { version = "=0.2.0", default-features = false, features = ["x360"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
