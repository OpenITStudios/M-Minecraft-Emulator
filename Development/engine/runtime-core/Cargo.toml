[package]
name = "m-bedrock-virtual-clients-core"
version = "0.1.0"
description = "M-Bedrock Virtual Clients runtime core"
authors = ["MIVUBI-STD"]
edition = "2021"
rust-version = "1.95"
publish = false

[[bin]]
name = "synthetic-fixture-handoff"
path = "src/bin/synthetic_fixture_handoff.rs"
required-features = ["synthetic-fixture-handoff"]

[features]
synthetic-fixture-handoff = []

[dependencies]
getrandom = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
ureq = { version = "3.4.2", default-features = false, features = ["json", "native-tls"] }
url = "2.5.8"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem",
  "Win32_System_Threading"
] }

# Lean daily Rust builds: retain panic backtrace line tables, not full symbols.
# Incremental compilation remains enabled for fast source iteration.
# Packaging uses profile.release and is intentionally unaffected.
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
debug = 0

# Cargo tests have their own profile; avoid restoring full dependency symbols.
[profile.test]
debug = "line-tables-only"
incremental = true

[profile.test.package."*"]
debug = 0
